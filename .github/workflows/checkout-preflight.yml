{
  "name": "Fork PR checkout proof (fork only)",
  "on": {
    "push": {
      "branches": [
        "codex/dotprompt-checkout-preflight"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "name": "Actual PR634 base repository plus fork head ref (baseline)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "google/dotprompt",
            "ref": "codex/dotprompt-go-validation-repair",
            "persist-credentials": false
          }
        }
      ],
      "timeout-minutes": 15
    },
    "fork-head": {
      "name": "Actual PR634 head repository plus head ref (patched)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-go-validation-repair",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "e47c49c8d1ed312828f75e102e4406e67d2fad5b",
            "EXPECTED_BRANCH": "codex/dotprompt-go-validation-repair"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "stable"
          }
        },
        {
          "name": "Runtime",
          "run": "go version"
        },
        {
          "name": "Actual upstream tidy command",
          "working-directory": "go",
          "run": "go mod tidy\ngit diff --exit-code -- go.mod go.sum"
        }
      ],
      "timeout-minutes": 15
    },
    "candidate": {
      "name": "Exact candidate fork checkout, tidy and lint",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-ci-policy-candidate",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "EXPECTED_BRANCH": "codex/dotprompt-ci-policy-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "stable"
          }
        },
        {
          "name": "Runtime",
          "run": "go version"
        },
        {
          "name": "Actual upstream tidy command",
          "working-directory": "go",
          "run": "go mod tidy\ngit diff --exit-code -- go.mod go.sum"
        },
        {
          "uses": "golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa",
          "with": {
            "version": "v2.14.0",
            "working-directory": "go",
            "install-mode": "goinstall"
          }
        }
      ],
      "timeout-minutes": 15
    },
    "same-repository": {
      "name": "Same-repository release-please branch control (no write)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "google/dotprompt",
            "ref": "release-please--branches--main",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "71bd8c2de27eec77d9035c20339645a32fe8d233",
            "EXPECTED_BRANCH": "release-please--branches--main"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "name": "Existing release-please prefix recognition (controlled branch value)",
          "env": {
            "CONTROL_HEAD_REF": "release-please--branches--main"
          },
          "run": "if [[ \"${CONTROL_HEAD_REF}\" == release-please--* ]]; then\n  echo \"is_release_please=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"is_release_please=false\" >> \"$GITHUB_OUTPUT\"\n  exit 1\nfi"
        }
      ],
      "timeout-minutes": 15
    },
    "maven": {
      "name": "Exact candidate Java ${{ matrix.java }} Maven lock",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "java": [
            17,
            21
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-ci-policy-candidate",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "EXPECTED_BRANCH": "codex/dotprompt-ci-policy-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "${{ matrix.java }}"
          }
        },
        {
          "uses": "bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77",
          "with": {
            "bazelisk-cache": true,
            "disk-cache": "checkout-maven-${{ matrix.java }}",
            "repository-cache": true
          }
        },
        {
          "name": "Exact upstream Maven pin",
          "run": "bazelisk run @maven//:pin"
        },
        {
          "name": "Exact upstream unchanged Maven lock",
          "run": "git diff --exit-code -- maven_install.json\ntest -z \"$(git status --porcelain maven_install.json)\""
        }
      ]
    },
    "push-control": {
      "name": "Actual push event repository and ref fallback",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.head_ref }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify push context source",
          "env": {
            "EXPECTED_SHA": "${{ github.sha }}",
            "EXPECTED_REPOSITORY": "${{ github.repository }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git remote get-url origin)\" = \"https://github.com/$EXPECTED_REPOSITORY\"\ngit show -s --format=\"%H %s\" HEAD"
        }
      ]
    },
    "changed-files": {
      "name": "Fixed changed-files actual path and output controls",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-ci-policy-candidate",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "EXPECTED_BRANCH": "codex/dotprompt-ci-policy-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "name": "Fixed action with actual Go workflow patterns",
          "uses": "tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32",
          "id": "go-files",
          "with": {
            "base_sha": "e47c49c8d1ed312828f75e102e4406e67d2fad5b",
            "sha": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "files": "go/**\nspec/**\n.github/workflows/go.yml"
          }
        },
        {
          "name": "Fixed action with actual lint workflow patterns",
          "uses": "tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32",
          "id": "lint-files",
          "with": {
            "base_sha": "e47c49c8d1ed312828f75e102e4406e67d2fad5b",
            "sha": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "files": "go/**\n.github/workflows/golangci-lint.yml"
          }
        },
        {
          "name": "Fixed action nonmatching-path control",
          "uses": "tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32",
          "id": "unrelated-files",
          "with": {
            "base_sha": "e47c49c8d1ed312828f75e102e4406e67d2fad5b",
            "sha": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "files": "docs/**"
          }
        },
        {
          "name": "Assert unchanged any_changed contract",
          "env": {
            "GO_CHANGED": "${{ steps.go-files.outputs.any_changed }}",
            "LINT_CHANGED": "${{ steps.lint-files.outputs.any_changed }}",
            "UNRELATED_CHANGED": "${{ steps.unrelated-files.outputs.any_changed }}"
          },
          "run": "test \"$GO_CHANGED\" = true\ntest \"$LINT_CHANGED\" = true\ntest \"$UNRELATED_CHANGED\" = false\necho \"Go=true lint=true unrelated=false\""
        }
      ]
    },
    "zizmor": {
      "name": "Exact required zizmor 1.25.2 changed-workflow policy",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-ci-policy-candidate",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "f79a8b193947d199e1037c30b86a90cbcfa80889",
            "EXPECTED_BRANCH": "codex/dotprompt-ci-policy-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "name": "Materialize exact upstream scanner configuration",
          "env": {
            "CONTROL_CONFIG_B64": "",
            "CONTROL_CONFIG_SHA256": "f276c5d5be89f26564de12f982e33843806b3944c62bad7a5ece1025311ad812"
          },
          "run": "python3 - <<'PYCONFIG'\nimport os,base64,hashlib\nfrom pathlib import Path\nraw=base64.b64decode(os.environ['CONTROL_CONFIG_B64'])\nassert hashlib.sha256(raw).hexdigest()==os.environ['CONTROL_CONFIG_SHA256']\nPath(os.environ['RUNNER_TEMP'],'zizmor-config.yaml').write_bytes(raw)\nprint('Exact config SHA256:',hashlib.sha256(raw).hexdigest())\nPYCONFIG"
        },
        {
          "name": "Exact upstream zizmor image and policy",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "docker run --rm   --volume \"$GITHUB_WORKSPACE:/workspace:ro\"   --volume \"$RUNNER_TEMP/zizmor-config.yaml:/zizmor-config.yaml:ro\"   --workdir /workspace   --env GH_TOKEN   ghcr.io/zizmorcore/zizmor:1.25.2@sha256:14ea7f5cc7c67933394a35b5a38a277397818d232602635edb2010b313afb110   --config /zizmor-config.yaml --format github --min-confidence medium --   .github/workflows/go.yml .github/workflows/golangci-lint.yml .github/workflows/bazel.yml"
        }
      ]
    }
  }
}
