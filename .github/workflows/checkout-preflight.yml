{
  "name": "Fork PR checkout proof (fork only)",
  "on": {
    "push": {
      "branches": [
        "codex/dotprompt-checkout-preflight"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "name": "Actual PR634 base repository plus fork head ref (baseline)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "google/dotprompt",
            "ref": "codex/dotprompt-go-validation-repair",
            "persist-credentials": false
          }
        }
      ],
      "timeout-minutes": 15
    },
    "fork-head": {
      "name": "Actual PR634 head repository plus head ref (patched)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-go-validation-repair",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "e47c49c8d1ed312828f75e102e4406e67d2fad5b",
            "EXPECTED_BRANCH": "codex/dotprompt-go-validation-repair"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "stable"
          }
        },
        {
          "name": "Runtime",
          "run": "go version"
        },
        {
          "name": "Actual upstream tidy command",
          "working-directory": "go",
          "run": "go mod tidy\ngit diff --exit-code -- go.mod go.sum"
        }
      ],
      "timeout-minutes": 15
    },
    "candidate": {
      "name": "Exact candidate fork checkout, tidy and lint",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-fork-ci-candidate",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "046239d6c70161ff443c34e23236be87a686e4fa",
            "EXPECTED_BRANCH": "codex/dotprompt-fork-ci-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "stable"
          }
        },
        {
          "name": "Runtime",
          "run": "go version"
        },
        {
          "name": "Actual upstream tidy command",
          "working-directory": "go",
          "run": "go mod tidy\ngit diff --exit-code -- go.mod go.sum"
        },
        {
          "uses": "golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa",
          "with": {
            "version": "v2.14.0",
            "working-directory": "go",
            "install-mode": "goinstall"
          }
        }
      ],
      "timeout-minutes": 15
    },
    "same-repository": {
      "name": "Same-repository release-please branch control (no write)",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "google/dotprompt",
            "ref": "release-please--branches--main",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "71bd8c2de27eec77d9035c20339645a32fe8d233",
            "EXPECTED_BRANCH": "release-please--branches--main"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "name": "Existing release-please prefix recognition (controlled branch value)",
          "env": {
            "CONTROL_HEAD_REF": "release-please--branches--main"
          },
          "run": "if [[ \"${CONTROL_HEAD_REF}\" == release-please--* ]]; then\n  echo \"is_release_please=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"is_release_please=false\" >> \"$GITHUB_OUTPUT\"\n  exit 1\nfi"
        }
      ],
      "timeout-minutes": 15
    },
    "maven": {
      "name": "Exact candidate Java ${{ matrix.java }} Maven lock",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "java": [
            17,
            21
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout explicit head branch",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "rksharma-owg/dotprompt",
            "ref": "codex/dotprompt-fork-ci-candidate",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source and branch",
          "env": {
            "EXPECTED_SHA": "046239d6c70161ff443c34e23236be87a686e4fa",
            "EXPECTED_BRANCH": "codex/dotprompt-fork-ci-candidate"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git branch --show-current)\" = \"$EXPECTED_BRANCH\"\ngit remote get-url origin\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "${{ matrix.java }}"
          }
        },
        {
          "uses": "bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77",
          "with": {
            "bazelisk-cache": true,
            "disk-cache": "checkout-maven-${{ matrix.java }}",
            "repository-cache": true
          }
        },
        {
          "name": "Exact upstream Maven pin",
          "run": "bazelisk run @maven//:pin"
        },
        {
          "name": "Exact upstream unchanged Maven lock",
          "run": "git diff --exit-code -- maven_install.json\ntest -z \"$(git status --porcelain maven_install.json)\""
        }
      ]
    },
    "push-control": {
      "name": "Actual push event repository and ref fallback",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.head_ref }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify push context source",
          "env": {
            "EXPECTED_SHA": "${{ github.sha }}",
            "EXPECTED_REPOSITORY": "${{ github.repository }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(git remote get-url origin)\" = \"https://github.com/$EXPECTED_REPOSITORY\"\ngit show -s --format=\"%H %s\" HEAD"
        }
      ]
    }
  }
}
